name: Agendador do Instagram

# A Vercel Hobby só roda cron 1x por dia. Este workflow chama a rota de publicação
# a cada 10 minutos para os posts agendados saírem no horário.
# Configure em Settings → Secrets and variables → Actions:
#   APP_URL      ex. https://orcamentos.devbossle.com.br
#   CRON_SECRET  o mesmo valor da variável CRON_SECRET na Vercel

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publicar posts vencidos
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL/CRON_SECRET não configurados; nada a fazer."
            exit 0
          fi
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/orcamentos/cron?tasks=publish"
