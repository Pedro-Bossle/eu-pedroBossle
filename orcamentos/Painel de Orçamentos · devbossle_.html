<style>
:root{--bg:#0c1210;--side:#0e1613;--card:#111a16;--card2:#16221c;--line:#1f2d27;--ink:#f4f6f3;--mut:#93a39b;--acc:#00d492;--accI:#04120c;--inp:#0c1210;--red:#ff7b7b;--yel:#f0b429;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f6f3;--side:#ffffff;--card:#ffffff;--card2:#eef2ee;--line:#dfe5e0;--ink:#121212;--mut:#5b6962;--acc:#007a55;--accI:#ffffff;--inp:#ffffff;--red:#c0392b;--yel:#8a5a00;color-scheme:light}

*,*:before,*:after{box-sizing:inherit}
body{margin:0;font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#0c1210;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:4px 8px 22px}.brand img{display:block;width:100%;max-width:176px;height:auto}.brand small{display:block;margin-top:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.lgl{display:none!important}:root[data-theme="light"] .lgd{display:none!important}:root[data-theme="light"] .lgl{display:block!important}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--mut);padding:11px 12px;border-radius:12px;margin:2px 0;min-height:44px;font-weight:600;font-size:13.5px}
.nav button:hover{background:var(--card2);color:var(--ink)}.nav button.on{background:var(--card2);color:var(--acc)}
.nav svg,.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sfoot{margin-top:auto;padding-top:14px}
main{padding:30px 32px 40px;max-width:1120px;width:100%;margin:0 auto}
.sec{display:none}.sec.on{display:block}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px;flex-wrap:wrap}.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}.top p{color:var(--mut);margin:6px 0 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;min-height:44px;font-weight:600;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn:hover{border-color:var(--acc)}.btn.p{background:var(--acc);color:var(--accI);border-color:var(--acc);font-weight:700}.btn.p:hover{opacity:.9}.btn.d{color:var(--red);border-color:transparent;background:transparent}.btn.d:hover{border-color:var(--red)}
.btn.s{padding:7px 12px;min-height:36px;font-size:12.5px;border-radius:10px}.btn[disabled]{opacity:.4;cursor:default}.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}.card h3{margin:0 0 12px;font-size:15px;font-weight:700}.stat{font-size:28px;font-weight:800;letter-spacing:-.02em}.mut{color:var(--mut);font-size:12.5px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fld{display:flex;flex-direction:column;gap:5px}.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:700}.hint{font-size:12px;color:var(--mut);margin-top:-1px}
input,textarea,select{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--inp);min-height:46px;width:100%;font-size:14px}textarea{min-height:104px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.75}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
input[type=checkbox]{width:20px;height:20px;min-height:20px;accent-color:var(--acc)}
.ex{align-self:flex-start;border:0;background:none;color:var(--acc);font-size:12px;font-weight:700;padding:2px 0;text-decoration:underline;min-height:28px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px;flex-wrap:wrap}.row small{display:block;color:var(--mut);font-size:12px}.row .nm{min-width:0;flex:1 1 260px}
.tag{font-size:10.5px;padding:3px 9px;border-radius:99px;background:var(--card2);font-weight:700;white-space:nowrap;color:var(--mut)}.tag.g{background:#00d49222;color:var(--acc)}.tag.y{background:#f0b42924;color:var(--yel)}.tag.r{background:#ff7b7b22;color:var(--red)}
.empty{text-align:center;padding:30px;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:16px}
.notice{padding:12px 14px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--yel);font-size:13px;margin:0 0 14px;border-radius:12px}.notice.g{border-left-color:var(--acc)}
.steps{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto}.stp{flex:1;min-width:96px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 8px;text-align:center;font-size:12px;font-weight:600;color:var(--mut);min-height:54px}
.stp b{display:block;font-size:15px}.stp.on{background:var(--acc);color:var(--accI);border-color:var(--acc)}.stp.ok{color:var(--acc)}
.wbar{display:flex;justify-content:space-between;gap:10px;margin-top:16px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:5;flex-wrap:wrap}
.it{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card2)}.it .g3{display:grid;grid-template-columns:1fr 1fr 150px;gap:10px;align-items:end}.it label{font-size:11.5px;font-weight:700;display:block;margin-bottom:4px}
.tot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:14px;font-weight:800;font-size:17px;flex-wrap:wrap}.tot input{max-width:200px;font-size:17px;font-weight:800;text-align:right}
.chk li{margin:3px 0}.paper{background:#fff;color:#121212;border:1px solid var(--line);border-radius:12px;padding:28px 30px;margin-bottom:14px;overflow:auto}
.lk{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}.lk:first-of-type{border-top:0}
.lk .ico{width:38px;height:38px;border-radius:12px;background:var(--card2);color:var(--acc);display:grid;place-items:center;flex:none}
.lk .nm{flex:1 1 240px;min-width:0}.lk b{display:block;font-size:13.5px;overflow-wrap:anywhere}.lk small{display:block;color:var(--mut);font-size:11.5px;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show{display:flex}.mb{background:var(--card);border:1px solid var(--line);border-radius:20px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:22px}.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.mh h2{margin:0;font-size:18px;font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accI);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:70;opacity:0;pointer-events:none;transition:.3s;max-width:92vw;text-align:center}.toast.on{opacity:1}
#pdfArea{display:none}
body.printing{background:#fff!important;color:#121212}body.printing .app,body.printing .modal,body.printing .toast{display:none!important}body.printing #pdfArea{display:block;padding:0 6mm}
.drag{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);color:var(--mut);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}.drag:hover{color:var(--acc);border-color:var(--acc)}.drag svg{width:16px;height:16px;fill:currentColor;stroke:none}
.dragging{opacity:.92;box-shadow:0 10px 30px #0007;border-color:var(--acc)!important;position:relative;z-index:3}
.ith{display:flex;align-items:center;gap:8px;margin-bottom:10px}.ith small{color:var(--mut);font-weight:700;flex:1}.mv{display:inline-flex;gap:4px}.mv .btn{padding:0;min-width:34px;min-height:34px;border-radius:10px}
.ls{border:1px solid var(--line);border-radius:14px;padding:6px 10px;margin-top:6px;background:var(--card2)}.lr{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.lr:first-child{border-top:0}.lr .tx{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}
.sv{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;margin-top:6px}.sv i{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block}
.ai{border:1px solid var(--acc);background:#00d49210;border-radius:16px;padding:14px;margin:0 0 14px}.ai b{display:block;margin-bottom:2px}
.sg{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card2)}.sg label{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer;font-size:13.5px}.sg pre{white-space:pre-wrap;margin:8px 0 0;font:inherit;font-size:12.5px;color:var(--mut)}
.pulse{animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.4}}
@page{size:A4;margin:12mm}
html{-webkit-text-size-adjust:100%}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:focus-visible,.nav button:focus-visible,.stp:focus-visible,.bnav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mtop,.bnav{display:none}.rv2{display:block}.paper{max-width:794px;margin-left:auto;margin-right:auto}
.pdf-h,.pdf .ft{flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media(min-width:851px) and (max-width:1100px){.app{grid-template-columns:210px 1fr}main{padding:24px 22px 36px}.side{padding:18px 10px}.grid{gap:10px}}

@media(max-width:850px){
.app{display:block}.side{display:none}

.bnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mut);font-size:10.5px;font-weight:600;padding:7px 2px;border-radius:12px;min-height:50px}.bnav button.on{color:var(--acc);background:var(--card2)}.bnav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.ed .bnav{display:none}
main{padding:16px 14px calc(92px + env(safe-area-inset-bottom,0px))}body.ed main{padding-bottom:12px}
.top{margin-bottom:16px}.top h1{font-size:22px}.top>.btn.p{width:100%}
.grid{grid-template-columns:1fr 1fr;gap:10px}.grid .card:last-child{grid-column:1/-1}.stat{font-size:24px}

.row{padding:12px}.row .act{width:100%}.row .act .btn{flex:1 1 auto}.row>.act>b{flex:1 0 100%;font-size:16px}
